services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mediconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Remi2026
      POSTGRES_DB: mediconnect_db
    ports:
      - "5433:5432"
    volumes:
      - mediconnect_data:/var/lib/postgresql/data

volumes:
  mediconnect_data: