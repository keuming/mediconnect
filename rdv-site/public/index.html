<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0A8F58" />
    <link rel="apple-touch-icon" href="https://manager.mediconnect4africa.cloud/icon-192.png" />
    <meta name="description" content="Prenez rendez-vous en ligne dans les cliniques et établissements de soins en Afrique de l'Ouest — MediConnect" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediConnect RDV" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="MediConnect — Prise de RDV en ligne" />
    <meta property="og:description" content="Prenez rendez-vous dans les meilleures cliniques d'Afrique de l'Ouest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rdv.mediconnect4africa.cloud" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

    <title>MediConnect — Prise de RDV en ligne</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mediconnect-rdv-theme');
          var mode = 'light';
          if (raw) {
            var parsed = JSON.parse(raw);
            mode = (parsed && parsed.state && parsed.state.mode) || 'light';
          }
          var bg = mode === 'dark' ? '#060C12' : '#F5F7FA';
          var text = mode === 'dark' ? '#F0F4F8' : '#101B26';
          document.documentElement.style.setProperty('--rdv-bg', bg);
          document.documentElement.style.setProperty('--rdv-text', text);
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A8F58'/><path d='M16 7v18M7 16h18' stroke='white' stroke-width='3.5' stroke-linecap='round'/></svg>" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { background: var(--rdv-bg, #F5F7FA); }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        background: var(--rdv-bg, #F5F7FA);
        color: var(--rdv-text, #101B26);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0E1620; }
      ::-webkit-scrollbar-thumb { background: #1E2F42; border-radius: 2px; }
      #root { min-height: 100vh; }

      /* PWA install banner */
      #pwa-banner {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #141E2B;
        border-top: 1px solid #1E2F42;
        padding: 16px 20px;
        z-index: 9999;
        align-items: center;
        gap: 12px;
        animation: slideUp .3s ease;
      }
      #pwa-banner.show { display: flex; }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
  </head>
  <body>
    <noscript>MediConnect nécessite JavaScript.</noscript>
    <div id="root"></div>

    <!-- PWA Install Banner -->
    <div id="pwa-banner">
      <div style="width:40px;height:40px;background:#0A8F58;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">+</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:14px;color:#F0F4F8">Installer MediConnect RDV</div>
        <div style="font-size:12px;color:#8BA0B5">Accès rapide depuis votre écran d'accueil</div>
      </div>
      <button id="pwa-install" style="background:#0A8F58;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer">Installer</button>
      <button id="pwa-dismiss" style="background:none;border:none;color:#8BA0B5;cursor:pointer;font-size:18px;padding:4px">✕</button>
    </div>

    <script>
      // Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      // PWA Install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('pwa-banner').classList.add('show');
      });
      document.getElementById('pwa-install')?.addEventListener('click', () => {
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
        document.getElementById('pwa-banner').classList.remove('show');
      });
      document.getElementById('pwa-dismiss')?.addEventListener('click', () => {
        document.getElementById('pwa-banner').classList.remove('show');
      });
    </script>
  </body>
</html>
